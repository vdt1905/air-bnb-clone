<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" font-family="Arial, sans-serif">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#577069"/></marker></defs>
<rect width="1600" height="1170" fill="#f8faf8"/>
<text x="64" y="65" font-size="38" font-weight="700" fill="#17302b">Vacation rental marketplace</text>
<text x="64" y="98" font-size="20" font-weight="400" fill="#577069">Production architecture · independently scalable reads, transactional bookings, and asynchronous media</text>
<rect x="64" y="131" width="1472" height="42" rx="10" fill="#fff0f3"/>
<text x="80" y="159" font-size="16" font-weight="500" fill="#17302b">PROPOSAL: production system below. Submitted app: React/Vite + Express + fixture data; no real payments or bookings.</text>
<text x="64" y="213" font-size="15" font-weight="700" fill="#577069">01 / GLOBAL DELIVERY</text>
<rect x="64" y="236" width="265" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="84" y="269" font-size="21" font-weight="600" fill="#17302b">Guests &amp; hosts</text><text x="84" y="295" font-size="16" font-weight="400" fill="#577069">Browser / mobile apps</text><text x="84" y="316" font-size="16" font-weight="400" fill="#577069">HTTPS, accessible interfaces</text>
<rect x="384" y="236" width="315" height="100" rx="14" fill="#e7f1eb" stroke="#adc4bc"/><text x="404" y="269" font-size="21" font-weight="600" fill="#17302b">CDN + edge security</text><text x="404" y="295" font-size="16" font-weight="400" fill="#577069">WAF, rate limiting, image CDN</text><text x="404" y="316" font-size="16" font-weight="400" fill="#577069">Cache public listing pages</text>
<rect x="755" y="236" width="365" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="775" y="269" font-size="21" font-weight="600" fill="#17302b">Web frontend / BFF</text><text x="775" y="295" font-size="16" font-weight="400" fill="#577069">SSR + client hydration</text><text x="775" y="316" font-size="16" font-weight="400" fill="#577069">Cache tags; authenticated sessions</text>
<rect x="1176" y="236" width="360" height="100" rx="14" fill="#e7f1eb" stroke="#adc4bc"/><text x="1196" y="269" font-size="21" font-weight="600" fill="#17302b">API gateway</text><text x="1196" y="295" font-size="16" font-weight="400" fill="#577069">Auth, quotas, request routing</text><text x="1196" y="316" font-size="16" font-weight="400" fill="#577069">Stateless regional replicas</text>
<path d="M329 286 L384 286" fill="none" stroke="#577069" stroke-width="2"  marker-end="url(#arrow)"/><path d="M699 286 L755 286" fill="none" stroke="#577069" stroke-width="2"  marker-end="url(#arrow)"/><path d="M1120 286 L1176 286" fill="none" stroke="#577069" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="64" y="395" font-size="15" font-weight="700" fill="#577069">02 / DOMAIN SERVICES · CONTAINERS ACROSS MULTIPLE AVAILABILITY ZONES</text>
<path d="M1356 336V405" fill="none" stroke="#577069" stroke-width="2"/>
<rect x="64" y="420" width="270" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="84" y="453" font-size="21" font-weight="600" fill="#17302b">Listings &amp; reviews</text><text x="84" y="479" font-size="16" font-weight="400" fill="#577069">Listing details, amenities</text><text x="84" y="500" font-size="16" font-weight="400" fill="#577069">Read replicas + cache</text>
<rect x="364" y="420" width="330" height="100" rx="14" fill="#fff0f3" stroke="#adc4bc"/><text x="384" y="453" font-size="21" font-weight="600" fill="#17302b">Availability &amp; booking</text><text x="384" y="479" font-size="16" font-weight="400" fill="#577069">Inventory holds; price quotes</text><text x="384" y="500" font-size="16" font-weight="400" fill="#577069">Idempotent reservation writes</text>
<rect x="724" y="420" width="270" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="744" y="453" font-size="21" font-weight="600" fill="#17302b">Users &amp; messaging</text><text x="744" y="479" font-size="16" font-weight="400" fill="#577069">Profiles, access control</text><text x="744" y="500" font-size="16" font-weight="400" fill="#577069">WebSocket conversation fanout</text>
<rect x="1024" y="420" width="240" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="1044" y="453" font-size="21" font-weight="600" fill="#17302b">Search</text><text x="1044" y="479" font-size="16" font-weight="400" fill="#577069">Geo + date + price filters</text><text x="1044" y="500" font-size="16" font-weight="400" fill="#577069">Ranking and pagination</text>
<rect x="1294" y="420" width="242" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="1314" y="453" font-size="21" font-weight="600" fill="#17302b">Media</text><text x="1314" y="479" font-size="16" font-weight="400" fill="#577069">Signed upload URLs</text><text x="1314" y="500" font-size="16" font-weight="400" fill="#577069">Resize / validate / encode</text>
<path d="M199 420V405H1415V420M529 405V420M859 405V420M1144 405V420" fill="none" stroke="#adc4bc" stroke-width="2"/>
<text x="64" y="584" font-size="15" font-weight="700" fill="#577069">03 / DATA &amp; EVENTS</text>
<rect x="64" y="613" width="430" height="100" rx="14" fill="#e7f1eb" stroke="#adc4bc"/><text x="84" y="646" font-size="21" font-weight="600" fill="#17302b">PostgreSQL · source of truth</text><text x="84" y="672" font-size="16" font-weight="400" fill="#577069">Transactions; constraints prevent double booking</text><text x="84" y="693" font-size="16" font-weight="400" fill="#577069">Read replicas; regional ownership per listing</text>
<rect x="524" y="613" width="270" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="544" y="646" font-size="21" font-weight="600" fill="#17302b">Redis</text><text x="544" y="672" font-size="16" font-weight="400" fill="#577069">Hot listing caches + TTLs</text><text x="544" y="693" font-size="16" font-weight="400" fill="#577069">Short-lived inventory holds</text>
<rect x="824" y="613" width="340" height="100" rx="14" fill="#e7f1eb" stroke="#adc4bc"/><text x="844" y="646" font-size="21" font-weight="600" fill="#17302b">Search index</text><text x="844" y="672" font-size="16" font-weight="400" fill="#577069">OpenSearch geo / text queries</text><text x="844" y="693" font-size="16" font-weight="400" fill="#577069">Eventual consistency; rebuildable</text>
<rect x="1194" y="613" width="342" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="1214" y="646" font-size="21" font-weight="600" fill="#17302b">Object storage</text><text x="1214" y="672" font-size="16" font-weight="400" fill="#577069">Originals + optimized image variants</text><text x="1214" y="693" font-size="16" font-weight="400" fill="#577069">CDN access; versioned object keys</text>
<path d="M314 520 L314 613" fill="none" stroke="#577069" stroke-width="2"  marker-end="url(#arrow)"/><path d="M529 520V560H394V613" fill="none" stroke="#577069" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M659 520 L659 613" fill="none" stroke="#577069" stroke-width="2"  marker-end="url(#arrow)"/><path d="M1144 520 L1144 613" fill="none" stroke="#577069" stroke-width="2"  marker-end="url(#arrow)"/><path d="M1415 520 L1415 613" fill="none" stroke="#577069" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="64" y="784" width="430" height="100" rx="14" fill="#e7f1eb" stroke="#adc4bc"/><text x="84" y="817" font-size="21" font-weight="600" fill="#17302b">Transactional outbox + event bus</text><text x="84" y="843" font-size="16" font-weight="400" fill="#577069">Booking events published after database commit</text><text x="84" y="864" font-size="16" font-weight="400" fill="#577069">At-least-once delivery; deduplicated consumers</text>
<rect x="554" y="784" width="390" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="574" y="817" font-size="21" font-weight="600" fill="#17302b">Background workers</text><text x="574" y="843" font-size="16" font-weight="400" fill="#577069">Email, notifications, image processing</text><text x="574" y="864" font-size="16" font-weight="400" fill="#577069">Retries with backoff; dead-letter queue</text>
<rect x="1004" y="784" width="532" height="100" rx="14" fill="#fff0f3" stroke="#adc4bc"/><text x="1024" y="817" font-size="21" font-weight="600" fill="#17302b">Payments provider</text><text x="1024" y="843" font-size="16" font-weight="400" fill="#577069">Tokenized checkout; idempotency keys + signed webhooks</text><text x="1024" y="864" font-size="16" font-weight="400" fill="#577069">Reconcile failures; never store raw card information</text>
<path d="M279 713 L279 784" fill="none" stroke="#577069" stroke-width="2"  marker-end="url(#arrow)"/><path d="M494 834 L554 834" fill="none" stroke="#577069" stroke-width="2"  marker-end="url(#arrow)"/><path d="M944 834 L1004 834" fill="none" stroke="#577069" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M430 784V750H994V713" fill="none" stroke="#577069" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="836" y="739" font-size="14" font-weight="400" fill="#577069">Index updates</text>
<text x="64" y="942" font-size="15" font-weight="700" fill="#577069">04 / DEPLOYMENT &amp; OPERATIONS</text>
<rect x="64" y="966" width="470" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="84" y="999" font-size="21" font-weight="600" fill="#17302b">Private source → CI → registry → deploy</text><text x="84" y="1025" font-size="16" font-weight="400" fill="#577069">Build, unit / browser / security checks; IaC</text><text x="84" y="1046" font-size="16" font-weight="400" fill="#577069">Canary releases; health checks; quick rollback</text>
<rect x="564" y="966" width="460" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="584" y="999" font-size="21" font-weight="600" fill="#17302b">Scale each workload independently</text><text x="584" y="1025" font-size="16" font-weight="400" fill="#577069">API replicas by latency / CPU; workers by queue lag</text><text x="584" y="1046" font-size="16" font-weight="400" fill="#577069">CDN absorbs read traffic; autoscale search nodes</text>
<rect x="1054" y="966" width="482" height="100" rx="14" fill="#fff" stroke="#adc4bc"/><text x="1074" y="999" font-size="21" font-weight="600" fill="#17302b">Observe &amp; recover</text><text x="1074" y="1025" font-size="16" font-weight="400" fill="#577069">Tracing, metrics, structured logs and alerting</text><text x="1074" y="1046" font-size="16" font-weight="400" fill="#577069">Multi-AZ replicas; backups; restore drills; failover</text>
<text x="64" y="1120" font-size="17" font-weight="500" fill="#17302b">Consistency: bookings and inventory are transactional. Search, caches, notifications, and analytics update asynchronously.</text>
<text x="64" y="1147" font-size="16" font-weight="400" fill="#577069">Security: least-privilege identities, encrypted transport/storage, secrets manager, audit trails, and bounded access to personal data.</text>
</svg>